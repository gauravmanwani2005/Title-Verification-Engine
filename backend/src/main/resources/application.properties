spring.application.name=backend

# Datasource configuration (Default to localhost:3306/title_verification)
spring.datasource.url=jdbc:mysql://localhost:3306/title_verification?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=8208228574
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Execute schema.sql to set up tables and custom indexes (e.g. FULLTEXT with ngram)
spring.sql.init.mode=always

# Cache configuration
spring.cache.type=concurrentmap

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.aiService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.aiService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.aiService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.aiService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.aiService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Candidate Pool — Retrieval Limits (how many raw candidates to pull from DB per mechanism)
candidate.fuzzy.retrieval.limit=100
candidate.phonetic.retrieval.limit=100
candidate.embedding.retrieval.limit=20

# Candidate Pool — Response Filter Thresholds (minimum score on at least ONE dimension to qualify for final response)
# A candidate is included if: fuzzyScore >= fuzzyThreshold OR phoneticScore >= phoneticThreshold OR embeddedScore >= embeddingThreshold
candidate.fuzzy.threshold=50.0
candidate.phonetic.threshold=75.0
candidate.embedding.threshold=70.0

