spring.application.name=backend

# Datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/title_verification?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=8208228574
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Execute schema.sql on startup to set up tables/indexes, data.sql for seed data
spring.sql.init.mode=never

# Cache configuration
spring.cache.type=concurrentmap

# Server port
server.port=8080

# AI / vector ANN service configuration
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.semantic-path=${AI_SERVICE_SEMANTIC_PATH:/api/semantic/similarity}
ai.service.vector-path=${AI_SERVICE_VECTOR_PATH:/api/vector/search}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:5000}
ai.embedding.model=${AI_EMBEDDING_MODEL:sentence-transformers/LaBSE}
ai.embedding.dimension=${AI_EMBEDDING_DIMENSION:768}
ai.embedding.similarity-threshold=${AI_EMBEDDING_SIMILARITY_THRESHOLD:0.0}

# Full URLs consumed directly by AiClient @Value fields
ai.service.url=${AI_SERVICE_BASE_URL:http://localhost:8000}/api/semantic/similarity
ai.vector.url=${AI_SERVICE_BASE_URL:http://localhost:8000}/api/vector/search
ai.gemini.url=${AI_SERVICE_BASE_URL:http://localhost:8000}/api/gemini/analyze

# Candidate Pool — Retrieval Limits (N=50 each per spec)
candidate.fuzzy.retrieval.limit=50
candidate.phonetic.retrieval.limit=50
candidate.vector.retrieval.limit=50

# Top-K after embedding ranking (K=20 per spec)
# Both property names supported for compatibility
ai.candidate.top-k=20
candidate.ai.scoring.limit=20

# Candidate Pool — Response Filter Thresholds
candidate.fuzzy.threshold=50.0
candidate.phonetic.threshold=75.0
candidate.embedding.threshold=70.0
candidate.semantic.threshold=70.0

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.aiService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.aiService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.aiService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.aiService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.aiService.automaticTransitionFromOpenToHalfOpenEnabled=true
